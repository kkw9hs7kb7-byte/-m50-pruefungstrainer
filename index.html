*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 15% -8%,rgba(123,170,255,.15),transparent 32rem),linear-gradient(180deg,var(--bg),#070c12 78%)}button{font:inherit;touch-action:manipulation}.shell{width:min(1000px,calc(100% - 24px));margin:auto}.top{position:sticky;top:0;z-index:20;background:rgba(9,16,24,.94);border-bottom:1px solid rgba(255,255,255,.07);backdrop-filter:blur(13px)}.topin{padding:14px 0 10px}.brand{font-weight:900;font-size:1.18rem;letter-spacing:-.03em}.nav{display:flex;gap:8px;margin-top:9px;overflow:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.navbtn{border:0;background:transparent;color:var(--muted);padding:10px 13px;border-radius:12px;font-weight:800;white-space:nowrap;cursor:pointer}.navbtn.active{background:var(--card2);color:var(--text)}main{padding:25px 0 60px}.hero{padding:8px 0 19px}.eyebrow{font-size:.76rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:900}.hero h1,.section-title{letter-spacing:-.05em;margin:.3rem 0 .55rem}.hero h1{font-size:clamp(2.15rem,8vw,3.6rem);line-height:1}.muted{color:var(--muted);line-height:1.55}.module-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.module-card,.panel,.stat{background:linear-gradient(180deg,var(--card),#101922);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.module-card{padding:22px}.module-card h2{font-size:1.65rem;margin:6px 0}.badge{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card2);color:var(--muted);padding:7px 10px;border-radius:999px;font-size:.82rem;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:17px 0}.stat{padding:13px;box-shadow:none;min-height:89px}.sl{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;font-weight:900}.sv{font-size:1.3rem;font-weight:950;margin-top:8px;letter-spacing:-.04em}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.btn{border:0;border-radius:14px;min-height:49px;padding:13px 17px;background:var(--accent);color:#06111f;font-weight:900;cursor:pointer}.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#592c32;color:#ffe5e8;border:1px solid #754047}.btn:disabled{opacity:.45}.panel{padding:clamp(17px,4vw,28px)}.mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.mode{background:#0f1923;border:1px solid var(--line);border-radius:16px;padding:17px;display:flex;flex-direction:column;min-height:185px}.mode h3{margin:8px 0 8px}.mode p{color:var(--muted);line-height:1.5;flex:1}.qtop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.qmeta{color:var(--muted);font-weight:800;font-size:.86rem}.qid{background:var(--card2);border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:var(--muted);font-size:.8rem}.progress{height:8px;border-radius:99px;background:#080e14;border:1px solid var(--line);overflow:hidden;margin-bottom:21px}.progress div{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}.question{font-size:clamp(1.22rem,4.6vw,1.7rem);font-weight:900;line-height:1.38;letter-spacing:-.02em;margin-bottom:18px}.answers{display:grid;gap:11px}.answer{width:100%;text-align:left;white-space:pre-line;line-height:1.48;border:1px solid var(--line);background:#0d1720;color:var(--text);padding:16px;border-radius:14px;cursor:pointer}.answer.selected{border-color:var(--accent);background:#182641}.answer.correct{border-color:rgba(110,201,154,.85);background:var(--okbg);color:#ecfff4}.answer.wrong{border-color:rgba(236,140,140,.85);background:var(--badbg);color:#ffecec}.feedback{margin-top:15px;padding:13px 15px;border-radius:13px;font-weight:900}.feedback.ok{background:var(--okbg);border:1px solid rgba(110,201,154,.5)}.feedback.bad{background:var(--badbg);border:1px solid rgba(236,140,140,.5)}.result{text-align:center;padding:8px 0 23px}.big{font-size:clamp(3.5rem,16vw,6rem);font-weight:950;line-height:.95;letter-spacing:-.07em;margin:13px 0 8px}.review-list{display:grid;gap:11px}.review{border:1px solid var(--line);background:#0e1821;border-radius:15px;padding:15px}.review.good{border-left:4px solid var(--ok)}.review.bad{border-left:4px solid var(--bad)}.review-title{font-weight:900;line-height:1.45;margin-bottom:10px}.row{display:grid;grid-template-columns:140px 1fr;gap:9px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06)}.row:first-of-type{border-top:0}.rowk{font-size:.84rem;color:var(--muted);font-weight:800}.rowv{white-space:pre-line;line-height:1.46}.empty{text-align:center;padding:34px 8px}.history{display:grid;gap:9px;margin-top:14px}.hist{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;border:1px solid var(--line);background:#0e1821;border-radius:13px;padding:12px 14px}.version{text-align:center;color:#647589;font-size:.75rem;margin-top:35px}.notice{background:#292316;border:1px solid #5a4825;color:#f7ddb0;padding:14px;border-radius:14px;line-height:1.5}
@media(max-width:760px){.module-grid{grid-template-columns:1fr}.mode-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:1fr}.rowk{margin-bottom:-4px}.hist{grid-template-columns:1fr auto}.hist .date{grid-column:1/-1;color:var(--muted)}}

<script id="data" type="application/json">{"version":"M51-M54-v2","modules":[{"id":"M51","title":"Modul 51","subtitle":"Wiederholung M51","examCount":24,"questions":[{"id":1,"question":"Was ist die Ballistik?","correct":"Die Lehre vom Wurf bzw. Schuss","wrong1":"Die Lehre von der Funktion und Steuerung von Rohrwaffen","wrong2":"Die Lehre von der Wirkung von Sprengstoffen im Ziel","uid":"M51-1"},{"id":2,"question":"In welche vier Phasen gliedert sich die Ballistik?","correct":"Innenballistik, Antrieb von Projektilen\nZwischen-/Übergangsballistik, 0,5-1x Kaliberlänge, Strömungsvorgänge der Pulvergase\nAußenballistik, Verhalten im Flug (Widerstand, Gravitation)\nEnd-/Zielballistik","wrong1":"Innenballistik, Startballistik, Flugballistik, Wirkungsballistik","wrong2":"Anzündballistik, Rohrballistik, Freiflugballistik, Auftreffballistik","uid":"M51-2"},{"id":3,"question":"Wovon ist der Ablauf des Antriebsvorganges abhängig?","correct":"Treibladung, Masse und Querschnittsfläche des Geschosses, Größe des Ladungsraumes, Länge und Form des Waffenrohres","wrong1":"Treibladungsmasse, Geschosslänge, Drallwinkel, Außentemperatur und Visierlinie","wrong2":"Geschossmasse, Mündungsgeschwindigkeit, Luftdruck, Zielentfernung und Rohrwerkstoff","uid":"M51-3"},{"id":4,"question":"Was wird in der Schießtechnik als Energiequelle genutzt und wieso?","correct":"Treibladungspulver (TLP), Druckverlauf ist einfach veränderbar durch eine andere chemische Zusammensetzung des TLP","wrong1":"Treibladungspulver (TLP), dessen Druckverlauf wird ausschließlich über die Korngröße eingestellt","wrong2":"Druckgas, weil der Druckverlauf über ein Regelventil während des Schusses verändert werden kann","uid":"M51-4"},{"id":5,"question":"Welcher Stoff wird TLP beigesetzt um die Explosionswärme herabzusetzen?","correct":"Nitroguanidin → dreibasiges TLP","wrong1":"Nitrocellulose → einbasiges TLP","wrong2":"Dinitrotoluol → zweibasiges TLP","uid":"M51-5"},{"id":6,"question":"Welche Anforderungen müssen Treibladungen erfüllen?","correct":"Handhabungssicherheit, Reaktion darf nicht in eine Detonation übergehen, Waffenschonend, geringes Mündungsfeuer","wrong1":"Hohe Detonationsneigung, maximale Verbrennungstemperatur, hoher Gasdruck, starkes Mündungsfeuer","wrong2":"Lagerstabilität, möglichst schlagartige Druckspitze, hohe Rohrbelastung, vollständige Umsetzung erst außerhalb der Mündung","uid":"M51-6"},{"id":7,"question":"Welche Teile einer Rohrwaffe sind für die Innenballistik relevant?","correct":"Rohr mit Verschluss, Geschoss, Treibladung","wrong1":"Patronenlager, Verschluss, Abzugseinrichtung","wrong2":"Rohr, Magazin, Zuführeinrichtung","uid":"M51-7"},{"id":8,"question":"Welche drei Arten des Rohrs sind heute gebräuchlich?","correct":"Glattrohr, hohe Abdichtung allerdings keine Drallstabilisierung ohne Leitwerk\nGezogenes Rohr, günstige Herstellung allerdings geringe Abdichtung und hoher Verschleiß\nPolygonrohr, Vorteile von glatt und gezogen aber geringerer Drall","wrong1":"Glattrohr mit hoher Drallstabilisierung; gezogenes Rohr mit geringer Führung; Polygonrohr ohne Abdichtung","wrong2":"Glattrohr mit geringer Abdichtung; gezogenes Rohr mit sehr geringer Reibung; Polygonrohr mit besonders hohem Drall","uid":"M51-8"},{"id":9,"question":"Wie entsteht Mündungsfeuer und wie kann man es vermeiden?","correct":"Verbrennung von unvollständig umgesetzten TLP an der Luft\nAnreicherung der Treibladung mit Sauerstoff (Nitroguanidin) oder mechanische Mündungsfeuerdämpfer","wrong1":"Durch Reibung des Geschosses im Rohr; vermieden durch Schmierung und Mündungsbremse","wrong2":"Durch heiße Pulvergase unmittelbar an der Mündung; vermieden durch Kühlung des Rohres und Reduzierung der Treibladung","uid":"M51-9"},{"id":10,"question":"Was sind Abgangsfehler?","correct":"Veränderung der Geschossbahn durch Gasschwaden in der Zwischenballistik oder Rohrbiegenschwingungen","wrong1":"Seitliche Ablenkung nach der Mündung durch Wind und Corioliskraft","wrong2":"Unterschiedliche Zündverzögerung des Anzündhütchens oder Störungen der Munitionszuführung","uid":"M51-10"},{"id":11,"question":"Womit beschäftigt sich die Außenballistik und von wo bis wo erstreckt sie sich?","correct":"Flugbahn von Projektilen, Abwurf von Körpern als Sonderfall des Schusses, Geschossstabilisierung und -form\n0,5-01x Kaliberlänge vor der Mündung bis zum Ziel","wrong1":"Bewegung des Geschosses vom Zünden der Treibladung bis zum Verlassen der Mündung; endet an der Rohrmündung","wrong2":"Flugbahn des Geschosses ab der Rohrmündung bis zum Ziel, jedoch ausschließlich unter Betrachtung von Luftwiderstand und Gravitation","uid":"M51-11"},{"id":12,"question":"Welche drei Möglichkeiten der Geschossstabilisierung gibt es?","correct":"Schwerpunktstabilisierung (mögl. vorne), Leitwerksstabilisierung, Drallstabilisierung","wrong1":"Drallstabilisierung, Kreiselstabilisierung, Schubvektorstabilisierung","wrong2":"Leitwerksstabilisierung, Schwerkraftstabilisierung, Druckpunktstabilisierung","uid":"M51-12"},{"id":13,"question":"Welche zwei Störkräfte wirken auf ein Drallstabilisiertes Geschoss?","correct":"Nutation (Taumeln der Geschossspitze), Energieverlust\nMagnus-Effekt, Abweichung von der Flugbahn","wrong1":"Präzession und Corioliskraft","wrong2":"Luftwiderstand und Gravitation","uid":"M51-13"},{"id":14,"question":"Welche Ballistik befasst sich mit allen Arten der Munitionswirkung?","correct":"End-/Zielballistik (Sprengwirkung, Panzerbrechend, Nebel etc.)","wrong1":"Außenballistik (Flugbahn, Luftwiderstand, Gravitation)","wrong2":"Zwischen-/Übergangsballistik (Strömungsvorgänge der Pulvergase)","uid":"M51-14"},{"id":15,"question":"Wie berechnet man die kinetische Energie?","correct":"1/2 × m × v² bzw. m/2 × v²","wrong1":"m × v²","wrong2":"1/2 × m × v","uid":"M51-15"},{"id":16,"question":"Was sind die Aufgaben der Waffeneinsatzanlage?","correct":"Anwahl, Schärfen, Abfeuern und Auslösen von Außenlasten und der Bordkanone\nEingabe der Auslösemodi, Verteilung der Auslösesignale, Bestimmung des sicheren Auslöseintervalls für bestimmte Waffentypen, Notabwurf (selective and emergency jettison), Sicherer Transport während des Tragflugs","wrong1":"Auswahl und Abwurf von Außenlasten, automatische Flugwegsteuerung, Zielbeleuchtung und Navigation","wrong2":"Scharfschalten der Bordkanone, Betätigung des Fahrwerks, Steuerung der Triebwerke und automatische Zielverfolgung","uid":"M51-16"},{"id":17,"question":"Woraus besteht die Waffeneinsatzanlage?","correct":"Waffenelektronische und waffenmechanische Anlage","wrong1":"Waffenrechner, Datenbus und Feuerleitrechner","wrong2":"Hydraulische und pneumatische Waffenanlage","uid":"M51-17"},{"id":18,"question":"Welche Arten der Lastenträger gibt es?","correct":"Flügellastträger (innere, äußere und Flügelspitzen)\nRumpflastträger (Shoulder und Centerpylon)","wrong1":"Unterflügellastträger, Rumpfmittellastträger und Hecklastträger","wrong2":"Innenlastträger, Außenlastträger und Schleppzielträger","uid":"M51-18"},{"id":19,"question":"Worauf ist bei Flügellastträgern von Schwenkflüglern zu achten?","correct":"Sie müssen in allen Flügelstellungen immer parallel zum Rumpf stehen","wrong1":"Sie müssen in allen Flügelstellungen parallel zur Flügelvorderkante stehen","wrong2":"Sie müssen bei jeder Flügelstellung einen festen Winkel von 90° zur Rumpflängsachse einhalten","uid":"M51-19"},{"id":20,"question":"Welche Besonderheit gibt es am Außenlastträger des Tiger?","correct":"Elevationstellantriebe (Elevation Slaving Unit – ESU) zum Ausgleich von Nickbewegungen im Vorwärtsflug","wrong1":"Rollstellantriebe zum Ausgleich von Rollbewegungen im Kurvenflug","wrong2":"Azimutstellantriebe zum Ausgleich von Gierbewegungen im Schwebeflug","uid":"M51-20"},{"id":21,"question":"Wie werden Außenlaststationen nummeriert?","correct":"Von außen nach innen und von links nach rechts (gerade rechts, ungerade links), Nur WaSys EF: Fuselage Centre Station 0","wrong1":"Von innen nach außen und von rechts nach links (gerade links, ungerade rechts), Centre Station 1","wrong2":"Von außen nach innen, links und rechts jeweils fortlaufend nummeriert, ohne besondere Center-Station","uid":"M51-21"},{"id":22,"question":"Was sind die Komponenten eines Lastträgers?","correct":"Tragende Struktur, Einbauräume, Verkabelung, Dekodiereinheit (PDU/SU = A/D-Wandler), Befestigung","wrong1":"Tragende Struktur, Einbauräume, Hydraulikleitungen, Ausstoßzylinder, Verriegelung","wrong2":"Tragstruktur, elektrische Versorgung, Datenrechner, Kühlgerät, aerodynamische Verkleidung","uid":"M51-22"},{"id":23,"question":"Was ist die Aufgabe von Lastenschlössern?","correct":"Aufhängen, Mitführen, Abwerfen/-stoßen und Auslösen von Außenlasten","wrong1":"Verriegeln, Ausrichten und elektrisch Versorgen von Außenlasten ohne Abwurfmöglichkeit","wrong2":"Aufnehmen, Schwenken und Stabilisieren von Außenlasten während des Fluges","uid":"M51-23"},{"id":24,"question":"Wie werden Lastenschlösser grob eingeteilt?","correct":"Schwer, 14“ und 30“, bis ca. 1600kg (HMERU/AHDERU)\nLeicht, 14“, bis ca. 700kg (LMERU/ALDERU)","wrong1":"Schwer, 14“ und 30“, bis ca. 1200kg; Leicht, 14“, bis ca. 900kg","wrong2":"Schwer, 30“ und 36“, bis ca. 1600kg; Leicht, 14“ und 30“, bis ca. 700kg","uid":"M51-24"},{"id":25,"question":"Welche drei Öffnungsarten für Lastenschlösser gibt es?","correct":"Pyrotechnisch, elektromechanisch und Pneumatisch sowie immer am Boden manuell mittels Vier- oder Sechskantschlüssel","wrong1":"Pyrotechnisch, hydraulisch und elektromechanisch; am Boden ausschließlich elektrisch","wrong2":"Elektromechanisch, hydraulisch und pneumatisch; am Boden manuell nur mittels Drehmomentschlüssel","uid":"M51-25"},{"id":26,"question":"Wie funktioniert die pyrotechnische Öffnung?","correct":"Zwei Kartuschen (ARD446-1) werden elektrisch gezündet und der Gaskolben wirkt auf das Zentralgelenk\nZusätzlich werden durch den Gasdruck die Abstoßkolben betätigt welche die Außenlast abstoßen","wrong1":"Eine Kartusche zündet mechanisch einen Entriegelungshebel; die Außenlast fällt ohne Abstoßimpuls ab","wrong2":"Ein Gasgenerator öffnet zwei Verriegelungshaken; die Abstoßkolben werden unabhängig davon elektrisch betätigt","uid":"M51-26"},{"id":27,"question":"Wie wird ein Nose-Tip beim Abstoßen erzeugt?","correct":"Durch Drosseln und Ventile im Gasdrucksystem","wrong1":"Durch zeitversetztes Zünden der beiden Kartuschen","wrong2":"Durch eine fest eingestellte Schrägstellung des Lastenschlosses","uid":"M51-27"},{"id":28,"question":"Wie funktioniert die elektromechanische Öffnung?","correct":"Durch die Ansteuerung von Elektromagneten, keine Abstoßung möglich","wrong1":"Durch einen Elektromotor mit Spindelantrieb, Abstoßung erfolgt über Federkraft","wrong2":"Durch Elektromagnete, anschließend erfolgt die Abstoßung über einen pneumatischen Kolben","uid":"M51-28"},{"id":29,"question":"Wie funktioniert die pneumatische Öffnung?","correct":"Prinzip ähnlich pyrotechn. Öffnung jedoch mittels Druckluft","wrong1":"Prinzip ähnlich elektromechanischer Öffnung, jedoch mittels Hydraulikdruck","wrong2":"Prinzip ähnlich pyrotechnischer Öffnung, jedoch mittels Unterdruck","uid":"M51-29"},{"id":30,"question":"Welche Sicherheitseinrichtungen für Boden bzw. Tragflug gibt es an Lastenschlössern?","correct":"Safety Handle (Bodensicherheit), verriegelt mechanisch das Verriegelungsgestänge in der Position „Safe“\nFixpunkte (Tragflugsicherheit) dienen der Aufnahme von nicht sicherheitsrelevanten Entsicherungsdrähten (Stabilisierungsflächen etc.)\nArming Units (Tragflugsicherheit) dienen der Aufnahme von sicherheitsrelevanten Entsicherungsdrähten (Zünder etc.)","wrong1":"Safety Handle verriegelt elektrisch die Auslösung; Fixpunkte nehmen alle Entsicherungsdrähte auf; Arming Units dienen nur der Lastzentrierung","wrong2":"Ground Safety Pin sichert den Abzug; Tragflugschalter lösen Entsicherungsdrähte elektrisch; Arming Units überwachen nur die Lastposition","uid":"M51-30"},{"id":31,"question":"Was ist die Aufgabe des Pratzsystems?","correct":"Verhindern von Schlingern der Last","wrong1":"Erhöhung der Abstoßgeschwindigkeit beim Waffenabwurf","wrong2":"Zentrierung der elektrischen Steckverbindung zwischen Last und Träger","uid":"M51-31"},{"id":32,"question":"Welche zwei Systeme der Pratzen gibt es?","correct":"Halbautomatisch, federgestützter Keil treibt drückt die Pratzarme zunehmend zusammen\nManuell, Pratzarme werden beim Anbau der Außenlast angelegt und mit Anzugswert versehen","wrong1":"Vollautomatisch durch hydraulische Pratzarme; halbautomatisch durch elektrische Stellmotoren","wrong2":"Federbelastet mit selbsttätiger Endverriegelung; pneumatisch mit Druckregelung beim Anbau","uid":"M51-32"},{"id":33,"question":"Was sind die Aufgaben von Startgeräten?","correct":"Mitführung und Verschuss von LFK, Datenübertragung, Spannungsversorgung LFK, Kühlmittelversorgung","wrong1":"Mitführung und Verschuss von LFK sowie eigenständige Zielsuche, Navigation und Waffenlenkung","wrong2":"Mechanische Aufnahme von LFK, Stromversorgung nur am Boden und Kühlung ausschließlich während der Wartung","uid":"M51-33"},{"id":34,"question":"Welche Zielsuchsysteme benötigen Kühlung und wie wird diese bereitgestellt?","correct":"Infrarotsuchköpfe (Eigenerwärmung verhindern), mittels Generators oder Druckgasflaschen","wrong1":"Radarsuchköpfe, Kühlung über Zapfluft oder Hydrauliköl","wrong2":"Lasersuchköpfe, Kühlung über flüssigen Stickstoff aus dem Flugzeugtank","uid":"M51-34"},{"id":35,"question":"Was ist das Besondere am Missile Ejector Launcher (nur WaSys EF)?","correct":"Verschuss geschieht durch Abstoßen, nicht durch Startschiene","wrong1":"Der LFK wird über eine Startschiene beschleunigt und erst danach vom Träger gelöst","wrong2":"Der LFK wird ohne Abstoßung durch sein eigenes Triebwerk direkt aus der Verriegelung gezogen","uid":"M51-35"},{"id":36,"question":"Was sind Beispiele für Mehrfachstartgeräte?","correct":"Raketenstartbehälter FZ225, STINGER, HOT, PARS 3LR","wrong1":"AIM-9, AIM-120, IRIS-T, HARM","wrong2":"TAURUS, AMRAAM, Sidewinder, HARM","uid":"M51-36"},{"id":37,"question":"Wozu dient die Bordkanonenanlage?","correct":"Verteidigung, Angriff von Luft- und Bodenzielen, Air Policing","wrong1":"Ausschließlich Bekämpfung von Bodenzielen und Warnschüsse im Air Policing","wrong2":"Selbstschutz gegen Flugkörper sowie Bekämpfung nur von Luftzielen im Nahbereich","uid":"M51-37"},{"id":38,"question":"Wie werden Bordkanonen unterschieden?","correct":"Eigenantrieb, Gasdruck- oder Rückstoßlader (Trommel-/Revolverkanone)\nFremdantrieb, Gatling Gun (elektrischer oder hydraulischer Antrieb)","wrong1":"Eigenantrieb, elektrisch oder hydraulisch angetrieben; Fremdantrieb, Gasdruck- oder Rückstoßlader","wrong2":"Eigenantrieb, ausschließlich Gasdrucklader; Fremdantrieb, ausschließlich Rückstoßlader","uid":"M51-38"},{"id":39,"question":"Nenne Beispiele für Gasdruck- und Rückstoßlader.","correct":"Mauser BK 27mm, MG M3M","wrong1":"M61A1 Vulcan, GAU-8A","wrong2":"GAU-12/U, M197","uid":"M51-39"},{"id":40,"question":"Nenne ein Beispiel für die Gatling Gun.","correct":"GAU-8A","wrong1":"DEFA 554","wrong2":"ADEN 30","uid":"M51-40"},{"id":41,"question":"Was ist bezüglich des grundsätzlichen Aufbaus einer Revolverkanone zu beachten?","correct":"Schwimmende Lagerung (Rückstoßminderung) + Torsion\nVollautomatischer Gasdrucklader nach dem Revolverprinzip mit automatischer, pyrotechnischer Durchladeeinrichtung","wrong1":"Starre Lagerung; fremdangetriebene Trommel; elektrische Durchladeeinrichtung","wrong2":"Schwimmende Lagerung; elektrisch angetriebener Mehrrohrsatz; hydraulische Durchladeeinrichtung","uid":"M51-41"},{"id":42,"question":"Wie kann man das Mündungsfeuer und den Rückstoß einer BK reduzieren?","correct":"Mündungsfeuerdämpfer (Tornado) / Blast Bottle (Eurofighter)","wrong1":"Mündungsfeuerdämpfer (Eurofighter) / Blast Bottle (Tornado)","wrong2":"Flammensperre (Tornado) / Rücklaufpuffer (Eurofighter)","uid":"M51-42"},{"id":43,"question":"Wie wird die BK 27mm im Tornado/EF gekühlt?","correct":"Belüftungsanlage mit Klappen/dauerhafte Zwangsbelüftung","wrong1":"Flüssigkeitskühlung mit Glykolkreislauf","wrong2":"Staudruckkühlung ohne Klappen oder Zwangsbelüftung","uid":"M51-43"},{"id":44,"question":"Was ist das Herzstück der Waffeneinsatzanlage und was sind die Aufgaben?","correct":"Waffenrechner; Mitführen von Außenlasten; Auswahl, Entsichern, Abfeuern und Auslösen der Außenlasten; Verteilung von Auslösesignalen, [Abfeuern BK]","wrong1":"Missionsrechner; Auswahl von Außenlasten, Flugwegsteuerung, Navigation und automatische Zielerkennung","wrong2":"Stores-Management-Rechner; reine Beladungserfassung, Gewichtsberechnung und Wartungsdiagnose","uid":"M51-44"},{"id":45,"question":"Welches Steuergerät ist für die Bordkanone zuständig?","correct":"Gun-/Bordkanonenrechner","wrong1":"Stores Management Computer","wrong2":"Flight Control Computer","uid":"M51-45"},{"id":46,"question":"Welche Steuereinheit übernimmt Weight & Balance?","correct":"Waffenrechner","wrong1":"Central Air Data Computer","wrong2":"Stores Interface Unit","uid":"M51-46"},{"id":47,"question":"Was ist die Aufgabe der Dekodiereinheit/PDU/PSU oder auch A/D-Wandler?","correct":"Bildet die Schnittstelle zwischen dem Lastenschloss, dem Launcher und der Außenlast","wrong1":"Wandelt analoge Sensorsignale der Außenlast in Flugsteuerdaten um","wrong2":"Versorgt Launcher und Außenlast ausschließlich mit elektrischer Leistung, ohne Datenschnittstelle","uid":"M51-47"},{"id":48,"question":"Welche wichtigen Bedienelemente umfasst die Waffeneinsatzanlage?","correct":"Master Armament Safety Switch (MASS), Freigabe Fire Power (28V DC)\nLate Arm Switch (LAS), letzte Sicherung vor dem Waffeneinsatz, mechanisch und elektrisch verzahnter Schutz\nTrigger, Feuern BK oder L/L LFK, sowie Triebwerkszündung, HUD-Kamera, FPR-Pod\nSelective/Emergency Jettison, Notabwurf angewählter/aller Außenlasten\nWeapon Release Button, Auslösung von vorgewählten Waffenpaketen","wrong1":"Master Arm Switch, Gun Enable, Jettison Select, Radar Trigger und Stores Test Button","wrong2":"Weapon Safety Selector, Engine Arm Switch, Release Trigger, Emergency Cut-Off und Load Transfer Button","uid":"M51-48"},{"id":49,"question":"Wozu dient der MIL-STD 1553B und was macht ihn aus?","correct":"Digitaler Zeitmultiplex/Antwortmultiplex Datenbus, Doppelredundant, bidirektional, Manchester II-kodiert, hohe Bitfehlersicherheit","wrong1":"Serieller Einfach-Datenbus, unidirektional, NRZ-kodiert und ohne Redundanz","wrong2":"Differenzieller Multi-Master-Datenbus mit variabler Bitrate und CSMA-Arbitrierung","uid":"M51-49"},{"id":50,"question":"Welche drei Komponenten umfasst der MIL-STD 1553B?","correct":"Bus Controller (BC), organisiert die gesamte Kommunikation\nRemote Terminal (RT), eigenständiger Computer, kommuniziert auf Anweisung des BC\nBus Monitor, externe Rechner zu Test- und Überwachungszwecken","wrong1":"Bus Master, Slave Terminal und Abschlusswiderstand","wrong2":"Controller Node, Router Unit und Gateway Monitor","uid":"M51-50"},{"id":51,"question":"Was ist der MIL-STD 1760 CLASS II und warum wird er genutzt?","correct":"Schnittstelle/Steckverbinder, dient der Interoperabilität und Standardisierung, reduziert Integrationskosten","wrong1":"Digitales Übertragungsprotokoll für Missionsdaten, das den MIL-STD 1553B ersetzt","wrong2":"Leistungswandler zur Anpassung unterschiedlicher Bordnetzspannungen an Außenlasten","uid":"M51-51"},{"id":52,"question":"Welche vier Interfaces gehören zum MIL-STD 1760 CLASS II?","correct":"Aircraft Station Interface (ASI)\n[Carriage Store Interface (CSI)]\n[Carriage Store Station Interface (CSSI)]\nMission Store Interface (MSI)","wrong1":"Aircraft Station Interface (ASI), Mission Store Interface (MSI), Release Store Interface (RSI), Store Service Interface (SSI)","wrong2":"Aircraft Store Interface (ASI), Carriage Unit Interface (CUI), Station Store Interface (SSI), Mission Interface Unit (MIU)","uid":"M51-52"},{"id":53,"question":"Wozu dient die Store Configuration und wie wird sie geladen?","correct":"Teilt dem LFZ die aktuelle Beladung mit, dient zur Ermittlung des Gesamtgewichts und dem Erstellen von Waffenpaketen\nManuell am Control Panel oder automatisch per Daten-Upload","wrong1":"Speichert nur die zulässigen Waffenfreigaben und wird ausschließlich vor dem Flug über ein Wartungsgerät geladen","wrong2":"Ermittelt Kraftstoff- und Schwerpunktdaten und wird automatisch über den Bordcomputer aus der Flugplanung geladen","uid":"M51-53"},{"id":54,"question":"Welche Verifikationen werden durchgeführt um Eingabefehler zu vermeiden?","correct":"Consistency Check (Verträglichkeit verschiedener Außenlasten), Compatability Check (Übereinstimmung Programmierung/Beladung)","wrong1":"Configuration Check (Abgleich Lastenplan), Loading Check (Abgleich physische Beladung)","wrong2":"Safety Check (Freigabestatus), Integrity Check (Datenbusprüfung)","uid":"M51-54"},{"id":55,"question":"Was ist die Feuerleitung?","correct":"Alle Vorgänge die notwendig sind um ein Ziel aufzufassen und die Bekämpfung erfolgreich durchzuführen","wrong1":"Ausschließlich die Berechnung von Vorhalt und Schussentfernung für die Bordkanone","wrong2":"Nur das Erkennen, Identifizieren und Freigeben eines Ziels vor dem Waffeneinsatz","uid":"M51-55"},{"id":56,"question":"Welche Forderungen müssen zur Feuerleitung betrachtet werden?","correct":"Entdecken, abfragen und markieren, identifizieren, priorisieren, Waffe auf das Ziel schalten, Lenkung der Waffe","wrong1":"Entdecken, verfolgen, klassifizieren, Entfernung messen, Waffe auswählen, Schusszeitpunkt berechnen","wrong2":"Suchen, identifizieren, freigeben, Waffenstatus prüfen, Zielkoordinaten speichern, Wirkung kontrollieren","uid":"M51-56"},{"id":57,"question":"Wie ist der Ablauf der Zielzuweisung und -erfassung?","correct":"Zielerfassung (Target Acquisition): Suchen, Ortung\nZielverfolgung (Target Tracking): Zielverfolgung, -vermessung\nZielbekämpfung: Auslösen der Waffen","wrong1":"Zielsuche: Klassifizieren und Identifizieren; Zielverfolgung: Suchen und Orten; Zielbekämpfung: Waffenfreigabe","wrong2":"Zielerfassung: Entfernung messen und Priorisieren; Zielverfolgung: Waffenwahl und Schärfen; Zielbekämpfung: Nachverfolgung der Wirkung","uid":"M51-57"}]},{"id":"M54","title":"Modul 54","subtitle":"Wiederholung M54","examCount":16,"questions":[{"id":1,"question":"Aus welchen Bekleidungsstücken besteht der Flugdienstanzug?","correct":"Fliegerkombi, Unterwäsche, Fliegerstiefel, Fliegerjacke, Fingerhandschuhe","wrong1":"Fliegerkombi, Funktionsunterwäsche, Fliegerstiefel, Fliegerweste, Lederhandschuhe","wrong2":"Fliegeroverall, Baumwollunterwäsche, Sicherheitsstiefel, Wetterschutzjacke, Montagehandschuhe","uid":"M54-1"},{"id":2,"question":"Was ist beim Stoff der Fliegerunterwäsche zu beachten?","correct":"Flammhemmend, aus Aramid","wrong1":"Antistatisch, aus Baumwoll-Aramid-Mischgewebe","wrong2":"Flammhemmend, aus Polyestergewebe","uid":"M54-2"},{"id":3,"question":"Was ist das Besondere an den Fliegerstiefeln?","correct":"Keine abfallenden Teile, nahezu glatte Sohle","wrong1":"Ausgeprägtes Sohlenprofil und abnehmbare Metallteile","wrong2":"Verstärkte Stahlkappe und stark profilierte rutschfeste Sohle","uid":"M54-3"},{"id":4,"question":"Wozu dient die weiße Farbgebung der Fliegerhandschuhe?","correct":"Hoher Kontrast, bessere Signalgebung","wrong1":"Zur Kennzeichnung unterschiedlicher Crew-Funktionen","wrong2":"Zur Verringerung der Infrarotsignatur bei Nacht","uid":"M54-4"},{"id":5,"question":"Wovor muss der Fliegerhelm schützen?","correct":"Stoß, Durchschlag, Staudruck beim Sitzausstoß, Lärmbelastungen","wrong1":"Vibrationen, Kälte, Kabinendruck und Blendwirkung","wrong2":"Hitze, Sauerstoffmangel, Unterdruck und elektromagnetische Strahlung","uid":"M54-5"},{"id":6,"question":"Welche weiteren Aufgaben erfüllt der Fliegerhelm?","correct":"Hörkapseln, Bügelmikrofon, ggf. Atemmaske (ab 10000 ft), Nachtsichtbrille, Träger für optische Systeme","wrong1":"Gehörschutz, Funkgerät, Sauerstoffspeicher, Wärmebildkamera und Visierheizung","wrong2":"Kopfhörer, Kehlkopfmikrofon, Notfunkbake, Sonnenschutzblende und Head-Up-Display","uid":"M54-6"},{"id":7,"question":"Welche zwei Visiere besitzt der Helm?","correct":"Klar, getönt (jeder Helm)","wrong1":"Klar, gelb getönt","wrong2":"Klar, polarisiert","uid":"M54-7"},{"id":8,"question":"Welche zwei Arten von Rettungswesten gibt es?","correct":"Fliegerrettungsschwimmweste (Flug über See)\nÜberlebensweste (Flug über Land)","wrong1":"Seenotweste für Landbetrieb und Überlebensweste für Seebetrieb","wrong2":"Flieger-Sicherheitsweste und Flieger-Schwimmkragen","uid":"M54-8"},{"id":9,"question":"Welche Aufgaben erfüllt die Rettungsweste?","correct":"Träger für: Notfunkgeräte, Notausrüstungsteile, sonstige Ausrüstungsteile (Pistolen), ballistischen Schutz (Drehflügler), Arm-Rückholsysteme, Atemunterstützung durch integrierte Druckblase, Fixierung für Schläuche und Kabel","wrong1":"Träger für Notfunkgerät, Fallschirmsteuerung, Sauerstoffvorrat, Werkzeug und Signalleuchten","wrong2":"Träger für Notausrüstung, Funkgerät, Kühlweste, Rettungsfallschirm und fest eingebauten Feuerlöscher","uid":"M54-9"},{"id":10,"question":"Welche zwei Notfunkgeräte kommen wann zum Einsatz?","correct":"MR 509: Friedensflugbetrieb zur Ortung von verunglückten Lfz-Besatzungen, sendet auf drei Frequenzen, Auslösung automatisch (Magnetstopfen bei Sitz-Mann-Trennung) oder manuell\nPRC-112G: Einsatzflugbetrieb, Sprach- und verschlüsselte Textnachrichten möglich, Textnachricht immer mit Positionsangabe und ID","wrong1":"MR 509: Einsatzflugbetrieb mit verschlüsselten Textnachrichten; PRC-112G: Friedensflugbetrieb zur automatischen Ortung auf drei Frequenzen","wrong2":"MR 509: nur Sprachfunk im Friedensflugbetrieb; PRC-112G: nur manuelle Notsignale ohne Positionsangabe","uid":"M54-10"},{"id":11,"question":"Wie kann man die Position eines Notfunkgerätes ermitteln?","correct":"Kreuzpeilung","wrong1":"GPS-Einzelortung über die Sendefrequenz","wrong2":"Entfernungsmessung über die Signalstärke einer Bodenstation","uid":"M54-11"},{"id":12,"question":"Aus welchen Bestandteilen besteht die Notausstattung?","correct":"Notausstattungsbehälter und Notausrüstung","wrong1":"Rettungsweste und Notfunkgerät","wrong2":"Notfallschirm und Überlebensanzug","uid":"M54-12"},{"id":13,"question":"Welche Arten von Notausstattungsbehältern gibt es?","correct":"GFK-Container, flexible Packtasche, integriert im Sitz","wrong1":"Aluminiumkoffer, starre Packschale, außen am Sitz montierter Behälter","wrong2":"Kunststoffkoffer, wasserdichte Rolltasche, integriert im Kabinendach","uid":"M54-13"},{"id":14,"question":"Wovon ist der Inhalt der Notausstattung abhängig?","correct":"Der Anzahl der zu rettenden Personen","wrong1":"Von Flugzeugtyp und geplanter Flugdauer","wrong2":"Von Einsatzhöhe und Außentemperatur","uid":"M54-14"},{"id":15,"question":"Wozu dient die Notausrüstung und was sind typische Bestandteile?","correct":"Dient dem Überleben der Besatzung, Signalmittel, Verpflegungsteile, Teile zu med. Selbstversorgung etc.","wrong1":"Dient der technischen Sicherung des Luftfahrzeugs, typische Bestandteile sind Werkzeug, Ersatzteile und Löschmittel","wrong2":"Dient ausschließlich der Ortung der Besatzung, typische Bestandteile sind Funkbake, Radarreflektor und GPS-Sender","uid":"M54-15"},{"id":16,"question":"Welche Arten von Kälteschutzbekleidung gibt es?","correct":"Fliegerkombination Seenot FSK-16 (Besatzung)\nKälteschutz Passagier KSP (Passagiere, Einheitsgröße 1,5-2m)","wrong1":"Fliegerkombination Seenot FSK-12 für Passagiere und Kälteschutz KSP für Besatzungen","wrong2":"Kälteschutzanzug FSK-16 für Einzelpiloten und Passagieranzug KSP in mehreren Körpergrößen","uid":"M54-16"},{"id":17,"question":"Wozu dient der Durachute und wie wird er ausgelöst?","correct":"Retten von Luftfahrzeugbesatzungen in Transportflugzeugen, Auslösung manuell oder automatisch durch CYPRESS-2 (Barometrisch)","wrong1":"Rettung von Besatzungen in Kampfflugzeugen, Auslösung ausschließlich manuell über den Abzugsgriff","wrong2":"Rettung von Transportflugzeugbesatzungen, automatische Auslösung durch einen Radarhöhenmesser ohne manuelle Möglichkeit","uid":"M54-17"},{"id":18,"question":"Wie Funktioniert der Durachute?","correct":"Hilfsschirm öffnet, zieht den großen Fallschirm heraus (Gleitverhältnis 1:1), Steuerung durch Steuerschlaufen begrenzt möglich","wrong1":"Der Hauptfallschirm öffnet unmittelbar, der Hilfsschirm stabilisiert nur; volle Steuerung über zwei Steuerleinen","wrong2":"Der Hilfsschirm öffnet nach dem Hauptfallschirm und bremst diesen; Steuerung ist nicht möglich","uid":"M54-18"},{"id":19,"question":"Wie sind Notausstiege gekennzeichnet?","correct":"Mit EXIT und Piktogrammen zur Bedienung","wrong1":"Mit roten Dreiecken und einer numerischen Öffnungsfolge","wrong2":"Mit gelb-schwarzer Warnmarkierung und dem Schriftzug EMERGENCY ONLY","uid":"M54-19"},{"id":20,"question":"Worauf ist bei Notausstiegen zu achten?","correct":"Unbeabsichtigte Öffnung (während des Fluges) nicht möglich","wrong1":"Sie dürfen während des Fluges nur unterhalb 250 kt geöffnet werden","wrong2":"Sie können im Flug geöffnet werden, wenn zwei Betätigungsgriffe gleichzeitig gezogen werden","uid":"M54-20"},{"id":21,"question":"Wozu dient die Anti-G-Bekleidung?","correct":"Schutz vor übermäßigen positiven Beschleunigungen (Blackout/Sichttrübung) durch Druckbeaufschlagung der Hose","wrong1":"Schutz vor negativen Beschleunigungen durch Zugentlastung an der Hose","wrong2":"Schutz vor hohen positiven Beschleunigungen durch mechanische Straffung der Schultergurte","uid":"M54-21"},{"id":22,"question":"Woraus besteht eine Rettungsanlage im Kampfflugzeug?","correct":"Schleudersitz, Kabinendach, Kabinendachabwurfanlage, Kabinendachglasaufsprenganlage, Ausschussfolgesteueranlage (ASA)","wrong1":"Schleudersitz, Kabinenhaube, Sitzverriegelung, Sauerstoffanlage und Notfunkgerät","wrong2":"Schleudersitz, Kabinendach, pyrotechnische Dachöffnung, Fahrwerksnotabsenkung und Bremsfallschirm","uid":"M54-22"},{"id":23,"question":"Wie wird der Schleudersitz ausgelöst?","correct":"Ein einziger Abzugsgriff, gesichert durch Sicherungsstift","wrong1":"Durch zwei getrennte Abzugsgriffe, jeweils ohne zusätzliche Sicherung","wrong2":"Durch einen elektrischen Taster, gesichert durch einen zweistufigen Schalter","uid":"M54-23"},{"id":24,"question":"Wie ist die grundsätzliche Ausschussfolge bei zweisitzigen Lfz?","correct":"Kabinendachabwurf, (redundant Glasaufsprengung), hinterer Schleudersitz (RC), vorderer Schleudersitz (FC)","wrong1":"Kabinendachabwurf, vorderer Schleudersitz (FC), hinterer Schleudersitz (RC)","wrong2":"Glasaufsprengung, gleichzeitiger Ausschuss beider Schleudersitze, danach Kabinendachabwurf","uid":"M54-24"},{"id":25,"question":"Wie ist der Ablauf des Schleudersitzausschusses?","correct":"Ziehen Abzugsgriff, Aktivierung Körperrückholung, Zünden der Haupttreibkartusche und Hilfskartuschen, Trennung PEC-Flugzeugteil, Anziehen Arm- und Beinrückholgurte, Zündung Raketenpackung, Öffnung Steuerschirm, stabiler Fall bis Auslösung barostatisches Zeitwerk, Öffnen Fallschirm, Sitz-Mann-Trennung, Trennung Survivalpack","wrong1":"Ziehen Abzugsgriff, Zündung Raketenpackung, Kabinendachabwurf, Trennung PEC, Öffnung Hauptfallschirm, danach Körperrückholung und Sitz-Mann-Trennung","wrong2":"Ziehen Abzugsgriff, Trennung Survivalpack, Öffnung Fallschirm, Aktivierung Körperrückholung, Zündung Haupttreibkartusche, Sitz-Mann-Trennung","uid":"M54-25"},{"id":26,"question":"Was ist Divergenz beim Schleudersitz?","correct":"Zeitversetzte Zündung und Ausstoß in unterschiedliche Richtungen","wrong1":"Gleichzeitige Zündung beider Sitze mit Ausstoß in gleicher Richtung","wrong2":"Zeitversetzter Ausstoß beider Sitze in derselben Richtung ohne seitlichen Versatz","uid":"M54-26"},{"id":27,"question":"Welche Fachgruppe ist für Schleudersitze verantwortlich?","correct":"FG (MB) Schleudersitz","wrong1":"FG (ME) Schleudersitz","wrong2":"FG (FL) Rettungssysteme","uid":"M54-27"},{"id":28,"question":"Welche Daten sammelt der Seat Sequencer?","correct":"Geschwindigkeit, Höhe, Beschleunigung","wrong1":"Geschwindigkeit, Kurs, Sinkrate","wrong2":"Höhe, Außentemperatur, Kabinendruck","uid":"M54-28"},{"id":29,"question":"Welche drei Betriebsarten kann der Seat Sequencer nutzen?","correct":"Sofort (unter 5000m, unter 550 km/h)\nHoch (über 5000m), kontrollierter Höhenabbau (Atmung)\nNiedrig (unter 5000m über 550 km/h), Geschwindigkeitsabbau","wrong1":"Sofort (unter 3000m, unter 450 km/h); Hoch (über 3000m), unkontrollierter Sinkflug; Niedrig (unter 3000m über 450 km/h), Höhenabbau","wrong2":"Sofort (unter 5000m, über 550 km/h); Hoch (unter 5000m), Geschwindigkeitsabbau; Niedrig (über 5000m), kontrollierter Höhenabbau","uid":"M54-29"},{"id":30,"question":"Wozu dient das Kabinendach?","correct":"Dem Schutz der Besatzung","wrong1":"Zur Aufnahme der Schleudersitzkräfte beim Ausschuss","wrong2":"Zur Verriegelung der Schleudersitze während des Rollens","uid":"M54-30"},{"id":31,"question":"Wie kann das Kabinendach im regulären Betrieb geöffnet/geschlossen werden?","correct":"Betätigungsgriffe innen und außen","wrong1":"Über einen elektrischen Schalter innen und einen Hydraulikanschluss außen","wrong2":"Nur über einen zentralen Handgriff im Cockpit","uid":"M54-31"},{"id":32,"question":"Wie kann das Kabinendach in Notsituationen geöffnet werden?","correct":"Notentriegelung Kabinendachmechanismus\nAbwurf Kabinendach (innere Griffe oder Sitzausschuss)\nKabinendachglasaufsprengung (innere/äußere Betätigungsgriffe)","wrong1":"Notentriegelung des Kabinendachmechanismus; hydraulisches Anheben des Daches; Abwurf über einen äußeren Wartungshebel","wrong2":"Kabinendachabwurf über die inneren Griffe; Öffnung über den regulären Antrieb; manuelle Entriegelung nur von außen","uid":"M54-32"},{"id":33,"question":"Was ertönt beim Schließen des Kabinendaches?","correct":"Kabinendachwarnhorn, verstummt beim Verriegeln","wrong1":"Ein Dauerton, der erst nach dem vollständigen Öffnen verstummt","wrong2":"Ein akustisches Signal erst nach dem Verriegeln des Daches","uid":"M54-33"},{"id":34,"question":"Wie nennt man den Kabinendachbetätigungsnotauskoppelmechanismus noch und wie wird nach dem Auskoppeln das Dach geöffnet?","correct":"Jack Release, von innen per Hand oder von außen mit Kran","wrong1":"Quick Disconnect; von innen hydraulisch oder von außen pneumatisch öffnen","wrong2":"Emergency Release; von innen elektrisch oder von außen mit Handkurbel öffnen","uid":"M54-34"},{"id":35,"question":"Welche Arten des Kabinendachabwurfs gibt es?","correct":"Normal-Abwurf, Auslösung durch Schleudersitz\nNot-Abwurf (Canopy-Jettison), durch Abwurfgriffe","wrong1":"Normal-Abwurf über äußere Abwurfgriffe; Not-Abwurf automatisch beim Schleudersitzausschuss","wrong2":"Normal-Abwurf über den Kabinendachantrieb; Not-Abwurf nur durch pyrotechnische Glasaufsprengung","uid":"M54-35"},{"id":36,"question":"Was macht das Ausschusswahlventil (Command Ejection)?","correct":"Auswahl nur hinten oder beide ausschießen, Kabinendach immer abwerfen","wrong1":"Auswahl vorderer Sitz oder beide Sitze; Kabinendach wird nur beim Doppelausschuss abgeworfen","wrong2":"Auswahl hinterer oder vorderer Sitz einzeln; Kabinendach bleibt beim Einzelausschuss grundsätzlich geschlossen","uid":"M54-36"},{"id":37,"question":"Womit wird das Kabinendach aufgesprengt?","correct":"Miniatursprengschnur (Miniature Detonator Cord MDC)\nBetätigung automatisch beim Ausschuss, oder manuell durch drei Griffe (FC, RC, außen)","wrong1":"Sprengbolzen entlang des Kabinendachrahmens; Betätigung ausschließlich automatisch beim Ausschuss","wrong2":"Lineare Schneidladung im Dachrahmen; Betätigung manuell über zwei Griffe im Cockpit","uid":"M54-37"},{"id":38,"question":"Welche drei Bauteile beeinflussen das Crashverhalten positiv?","correct":"Schockabsorbierende Sitze\nLandewerk mit hoher Energieaufnahme\nUnterbodenstruktur mit spezieller Energieaufnahme","wrong1":"Verstärkte Kabinenstruktur, energieabsorbierende Tragflächen, nachgiebige Steuerflächen","wrong2":"Verformbare Sitzschienen, nachgebende Cockpithaube, energieabsorbierende Seitenleitwerksstruktur","uid":"M54-38"},{"id":39,"question":"Welche drei Landungen gibt es beim Fahrwerk?","correct":"Normale Landung (bis 3,05 m/s), keine Verformung\nHarte Landung (3,05 bis 6 m/s), keine Bodenberührung der Struktur\nCrash (6 bis 10,5 m/s), kontrollierte Zerstörung der Struktur","wrong1":"Normale Landung (bis 2,5 m/s), keine Verformung; Harte Landung (2,5 bis 5 m/s), kontrollierte Verformung; Crash (5 bis 8 m/s), Struktur bleibt intakt","wrong2":"Normale Landung (bis 3,05 m/s), leichte Verformung; Harte Landung (3,05 bis 7 m/s), Bodenberührung zulässig; Crash (über 7 m/s), unkontrollierte Zerstörung","uid":"M54-39"},{"id":40,"question":"Wie funktioniert die Energieaufnahme bei einem schockabsorbierenden Sitz?","correct":"Stahlbuchse mit Schneidzähnen schneiden sich in die Aluminiumstange und nehmen so Crash-Energien auf","wrong1":"Eine teleskopierbare Gasfeder wird komprimiert und wandelt die Crash-Energie in Wärme um","wrong2":"Ein Aluminium-Honeycomb unter dem Sitz wird gestaucht und nimmt dabei die gesamte Crash-Energie auf","uid":"M54-40"}]}]}</script>
<script>
(function(){
"use strict";
var DATA=JSON.parse(document.getElementById("data").textContent), MODULES=DATA.modules, QMAP={}, MODMAP={};
for(var m=0;m<MODULES.length;m++){MODMAP[MODULES[m].id]=MODULES[m];for(var i=0;i<MODULES[m].questions.length;i++)QMAP[MODULES[m].questions[i].uid]=MODULES[m].questions[i]}
var app=document.getElementById("app"),mem={};
var KEYS={history:"m51m54_history_v2",errors:"m51m54_errors_v2"};
var state={view:"home",moduleId:null,exam:null,learn:null,error:null};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){if(c==="&")return "&amp;";if(c==="<")return "&lt;";if(c===">")return "&gt;";if(c==="\"")return "&quot;";return "&#39;"})}
function block(s){return esc(s).split("\n").join("<br>")}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function get(k,d){try{var x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:d}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
function pct(v){if(v==null||isNaN(Number(v)))return "–";return (Math.round(Number(v)*10)/10).toLocaleString("de-DE",{maximumFractionDigits:1})+" %"}
function fmtDate(v){try{return new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(v))}catch(e){return v||""}}
function histories(){var h=get(KEYS.history,{M51:[],M54:[]});if(!h||typeof h!=="object")h={M51:[],M54:[]};if(!Array.isArray(h.M51))h.M51=[];if(!Array.isArray(h.M54))h.M54=[];return h}
function errors(){var e=get(KEYS.errors,{M51:{},M54:{}});if(!e||typeof e!=="object")e={M51:{},M54:{}};if(!e.M51)e.M51={};if(!e.M54)e.M54={};return e}
function addError(mid,uid){var e=errors();e[mid][uid]={lastWrong:new Date().toISOString()};set(KEYS.errors,e)}
function removeError(mid,uid){var e=errors();delete e[mid][uid];set(KEYS.errors,e)}
function errorIds(mid){var e=errors()[mid]||{},out=[];for(var k in e)if(QMAP[k])out.push(k);return out}
function stats(mid){var a=histories()[mid]||[];if(!a.length)return{count:0,last:null,avg:null};var sum=0,n=0;for(var i=0;i<a.length;i++){var p=Number(a[i].percent);if(!isNaN(p)){sum+=p;n++}}return{count:a.length,last:Number(a[a.length-1].percent),avg:n?sum/n:null}}
function moduleCard(mod){var s=stats(mod.id),ec=errorIds(mod.id).length;return '<article class="module-card"><span class="badge">'+mod.questions.length+' Originalfragen</span><h2>'+esc(mod.title)+'</h2><p class="muted">Prüfung: '+mod.examCount+' zufällige Fragen · Lern- und Fehlerfragenmodus separat.</p><div class="stats"><div class="stat"><div class="sl">Prüfungen</div><div class="sv">'+s.count+'</div></div><div class="stat"><div class="sl">Letztes Ergebnis</div><div class="sv">'+pct(s.last)+'</div></div><div class="stat"><div class="sl">Durchschnitt</div><div class="sv">'+pct(s.avg)+'</div></div><div class="stat"><div class="sl">Fehlerfragen</div><div class="sv">'+ec+'</div></div></div><button class="btn" data-open="'+mod.id+'">'+esc(mod.title)+' öffnen</button></article>'}
function renderHome(){state.moduleId=null;show("home");app.innerHTML='<section class="hero"><div class="eyebrow">Nur Modul 51 &amp; Modul 54</div><h1>Prüfungstrainer</h1><p class="muted">Jedes Modul hat seinen eigenen Prüfungsmodus, Lernmodus, Fehlerfragen und eine getrennte Statistik.</p></section><section class="module-grid">'+moduleCard(MODMAP.M51)+moduleCard(MODMAP.M54)+'</section><div class="version">Version M51/M54 v2 · 2026-10-07</div>';var bs=document.querySelectorAll("[data-open]");for(var i=0;i<bs.length;i++)bs[i].onclick=function(){renderModule(this.getAttribute("data-open"))}}
function renderModule(mid){var mod=MODMAP[mid],s=stats(mid),ec=errorIds(mid).length,h=histories()[mid]||[];show("module",mid);var hist="";for(var i=Math.max(0,h.length-5);i<h.length;i++){var x=h[i];hist+='<div class="hist"><div class="date">'+esc(fmtDate(x.date))+'</div><b>'+Number(x.correct||0)+'/'+Number(x.total||0)+'</b><b>'+pct(x.percent)+'</b></div>'}app.innerHTML='<section class="hero"><div class="eyebrow">'+esc(mod.subtitle)+'</div><h1>'+esc(mod.title)+'</h1><p class="muted">'+mod.questions.length+' Fragen im Originalfragenpool. Die Prüfung zieht '+mod.examCount+' davon zufällig und ohne Wiederholung.</p></section><section class="stats"><div class="stat"><div class="sl">Prüfungen</div><div class="sv">'+s.count+'</div></div><div class="stat"><div class="sl">Letztes Ergebnis</div><div class="sv">'+pct(s.last)+'</div></div><div class="stat"><div class="sl">Durchschnitt</div><div class="sv">'+pct(s.avg)+'</div></div><div class="stat"><div class="sl">Fehlerfragen</div><div class="sv">'+ec+'</div></div></section><section class="mode-grid"><article class="mode"><span class="badge">'+mod.examCount+' Fragen</span><h3>Prüfungsmodus</h3><p>Zufällige, unterschiedliche Fragen. Keine Auflösung bis zum Prüfungsende.</p><button class="btn" id="examBtn">Prüfung starten</button></article><article class="mode"><span class="badge">Alle '+mod.questions.length+'</span><h3>Lernmodus</h3><p>Alle Fragen werden in zufälliger Reihenfolge genau einmal gezeigt, bevor ein neuer Durchlauf beginnt.</p><button class="btn" id="learnBtn">Lernen</button></article><article class="mode"><span class="badge">'+ec+' offen</span><h3>Fehlerfragen</h3><p>Falsch beantwortete Fragen bleiben hier, bis du sie einmal korrekt beantwortet hast.</p><button class="btn" id="errBtn">Fehler lernen</button></article></section><section class="panel" style="margin-top:15px"><h2 class="section-title">Statistik '+esc(mod.title)+'</h2>'+(hist?'<div class="history">'+hist+'</div>':'<p class="muted">Noch keine Prüfung abgeschlossen.</p>')+'<div class="actions"><button class="btn secondary" id="homeBtn">Zur Startseite</button>'+(h.length?'<button class="btn danger" id="clearBtn">Statistik dieses Moduls löschen</button>':'')+'</div></section>';
document.getElementById("examBtn").onclick=function(){startExam(mid)};document.getElementById("learnBtn").onclick=function(){startLearn(mid)};document.getElementById("errBtn").onclick=function(){startErrorMode(mid)};document.getElementById("homeBtn").onclick=renderHome;if(h.length)document.getElementById("clearBtn").onclick=function(){if(confirm("Statistik für "+mod.title+" wirklich löschen?")){var hh=histories();hh[mid]=[];set(KEYS.history,hh);renderModule(mid)}}}
function makeChoices(q){return shuffle([q.correct,q.wrong1,q.wrong2])}
function startExam(mid){var mod=MODMAP[mid],pool=shuffle(mod.questions),items=[];for(var i=0;i<mod.examCount;i++)items.push({uid:pool[i].uid,choices:makeChoices(pool[i]),selected:-1});state.exam={mid:mid,index:0,items:items,result:null};renderExam()}
function renderExam(){var ex=state.exam,mod=MODMAP[ex.mid],it=ex.items[ex.index],q=QMAP[it.uid],n=ex.index+1,ans="";show("exam",ex.mid);for(var i=0;i<it.choices.length;i++)ans+='<button class="answer'+(it.selected===i?' selected':'')+'" data-a="'+i+'">'+block(it.choices[i])+'</button>';app.innerHTML='<section class="panel"><div class="qtop"><div class="qmeta">'+esc(mod.title)+' · Frage '+n+' von '+ex.items.length+'</div><div class="qid">Original Nr. '+q.id+'</div></div><div class="progress"><div style="width:'+(n/ex.items.length*100)+'%"></div></div><div class="question">'+esc(q.question)+'</div><div class="answers">'+ans+'</div><div class="actions"><button class="btn" id="next" '+(it.selected<0?'disabled':'')+'>'+(n===ex.items.length?'Prüfung auswerten':'Weiter')+'</button></div><p class="muted" style="margin-top:14px;font-size:.88rem">Die richtige Antwort wird erst am Ende angezeigt.</p></section>';var bs=document.querySelectorAll("[data-a]");for(i=0;i<bs.length;i++)bs[i].onclick=function(){it.selected=Number(this.getAttribute("data-a"));renderExam()};document.getElementById("next").onclick=function(){if(it.selected<0)return;if(ex.index<ex.items.length-1){ex.index++;renderExam()}else finishExam()}}
function finishExam(){var ex=state.exam,right=0,rev=[];for(var i=0;i<ex.items.length;i++){var it=ex.items[i],q=QMAP[it.uid],chosen=it.choices[it.selected],ok=chosen===q.correct;if(ok)right++;else addError(ex.mid,q.uid);rev.push({q:q,chosen:chosen,ok:ok})}var p=right/ex.items.length*100,h=histories();h[ex.mid].push({date:new Date().toISOString(),correct:right,total:ex.items.length,percent:p});set(KEYS.history,h);ex.result={right:right,total:ex.items.length,percent:p,rev:rev};renderResult()}
function renderResult(){var ex=state.exam,r=ex.result,mod=MODMAP[ex.mid],list="";show("result",ex.mid);for(var i=0;i<r.rev.length;i++){var x=r.rev[i];list+='<article class="review '+(x.ok?'good':'bad')+'"><div class="review-title">'+(i+1)+'. '+esc(x.q.question)+' '+(x.ok?'✅':'❌')+'</div><div class="row"><div class="rowk">Deine Antwort</div><div class="rowv">'+block(x.chosen)+'</div></div><div class="row"><div class="rowk">Richtige Antwort</div><div class="rowv">'+block(x.q.correct)+'</div></div></article>'}app.innerHTML='<section class="panel"><div class="result"><div class="eyebrow">'+esc(mod.title)+' · Prüfung abgeschlossen</div><div class="big">'+r.right+' / '+r.total+'</div><h2>'+pct(r.percent)+'</h2><p class="muted">'+(r.total-r.right)+' falsch beantwortete Frage(n) wurden den Fehlerfragen hinzugefügt.</p></div><div class="review-list">'+list+'</div><div class="actions"><button class="btn secondary" id="module">Zur Modulübersicht</button><button class="btn secondary" id="errors">Fehlerfragen</button><button class="btn" id="again">Neue Prüfung</button></div></section>';document.getElementById("module").onclick=function(){renderModule(ex.mid)};document.getElementById("errors").onclick=function(){startErrorMode(ex.mid)};document.getElementById("again").onclick=function(){startExam(ex.mid)}}
function newLearnDeck(mid,lastUid){var d=shuffle(MODMAP[mid].questions.map(function(q){return q.uid}));if(lastUid&&d.length>1&&d[0]===lastUid){var t=d[0];d[0]=d[1];d[1]=t}return d}
function startLearn(mid){state.learn={mid:mid,deck:newLearnDeck(mid,null),pos:0,current:null,choices:[],answered:false,selected:-1,right:0,wrong:0,cycle:1,lastUid:null};nextLearn()}
function nextLearn(){var l=state.learn;if(l.pos>=l.deck.length){l.deck=newLearnDeck(l.mid,l.lastUid);l.pos=0;l.cycle++}var uid=l.deck[l.pos++],q=QMAP[uid];l.current=uid;l.lastUid=uid;l.choices=makeChoices(q);l.answered=false;l.selected=-1;renderLearn()}
function renderLearn(){var l=state.learn,q=QMAP[l.current],mod=MODMAP[l.mid],ans="",ok=false;show("learn",l.mid);for(var i=0;i<l.choices.length;i++){var c="";if(l.answered){if(l.choices[i]===q.correct)c=" correct";else if(i===l.selected)c=" wrong"}ans+='<button class="answer'+c+'" data-la="'+i+'" '+(l.answered?'disabled':'')+'>'+block(l.choices[i])+'</button>'}if(l.answered)ok=l.choices[l.selected]===q.correct;var shown=l.pos,remaining=l.deck.length-l.pos;app.innerHTML='<section class="panel"><div class="qtop"><div class="qmeta">'+esc(mod.title)+' · Lernrunde '+l.cycle+' · '+shown+'/'+l.deck.length+'</div><div class="qid">Original Nr. '+q.id+'</div></div><div class="progress"><div style="width:'+(shown/l.deck.length*100)+'%"></div></div><div class="stats"><div class="stat"><div class="sl">Richtig</div><div class="sv">'+l.right+'</div></div><div class="stat"><div class="sl">Falsch</div><div class="sv">'+l.wrong+'</div></div><div class="stat"><div class="sl">Noch in Runde</div><div class="sv">'+remaining+'</div></div><div class="stat"><div class="sl">Runde</div><div class="sv">'+l.cycle+'</div></div></div><div class="question">'+esc(q.question)+'</div><div class="answers">'+ans+'</div>'+(l.answered?'<div class="feedback '+(ok?'ok':'bad')+'">'+(ok?'Richtig ✅':'Falsch ❌')+'</div>':'')+'<div class="actions">'+(l.answered?'<button class="btn" id="lnext">Nächste Frage</button>':'')+'<button class="btn secondary" id="lback">Modulübersicht</button></div></section>';if(!l.answered){var bs=document.querySelectorAll("[data-la]");for(i=0;i<bs.length;i++)bs[i].onclick=function(){l.selected=Number(this.getAttribute("data-la"));l.answered=true;if(l.choices[l.selected]===q.correct)l.right++;else{l.wrong++;addError(l.mid,q.uid)}renderLearn()}}else document.getElementById("lnext").onclick=nextLearn;document.getElementById("lback").onclick=function(){renderModule(l.mid)}}
function startErrorMode(mid){var ids=errorIds(mid);state.error={mid:mid,deck:shuffle(ids),pos:0,current:null,choices:[],answered:false,selected:-1,lastUid:null};if(!ids.length){renderNoErrors(mid);return}nextError()}
function nextError(){var e=state.error,active=errorIds(e.mid);if(!active.length){renderNoErrors(e.mid);return}var filtered=e.deck.filter(function(uid){return active.indexOf(uid)>=0});if(e.pos>=filtered.length||!filtered.length){filtered=shuffle(active);if(e.lastUid&&filtered.length>1&&filtered[0]===e.lastUid){var t=filtered[0];filtered[0]=filtered[1];filtered[1]=t}e.deck=filtered;e.pos=0}else e.deck=filtered;var uid=e.deck[e.pos++],q=QMAP[uid];e.current=uid;e.lastUid=uid;e.choices=makeChoices(q);e.answered=false;e.selected=-1;renderError()}
function renderNoErrors(mid){show("errors",mid);app.innerHTML='<section class="panel empty"><div style="font-size:2.5rem">🎉</div><h2>Keine offenen Fehlerfragen in '+esc(MODMAP[mid].title)+'</h2><p class="muted">Falsch beantwortete Fragen aus Prüfung oder Lernmodus erscheinen hier.</p><button class="btn" id="back">Zur Modulübersicht</button></section>';document.getElementById("back").onclick=function(){renderModule(mid)}}
function renderError(){var e=state.error,q=QMAP[e.current],mod=MODMAP[e.mid],ans="",ok=false;show("errors",e.mid);for(var i=0;i<e.choices.length;i++){var c="";if(e.answered){if(e.choices[i]===q.correct)c=" correct";else if(i===e.selected)c=" wrong"}ans+='<button class="answer'+c+'" data-ea="'+i+'" '+(e.answered?'disabled':'')+'>'+block(e.choices[i])+'</button>'}if(e.answered)ok=e.choices[e.selected]===q.correct;app.innerHTML='<section class="panel"><div class="qtop"><div class="qmeta">'+esc(mod.title)+' · Fehlerfragen · '+errorIds(e.mid).length+' offen</div><div class="qid">Original Nr. '+q.id+'</div></div><div class="question">'+esc(q.question)+'</div><div class="answers">'+ans+'</div>'+(e.answered?'<div class="feedback '+(ok?'ok':'bad')+'">'+(ok?'Richtig ✅ · Frage wurde aus den Fehlerfragen entfernt.':'Falsch ❌ · Die Frage bleibt in den Fehlerfragen.')+'</div>':'')+'<div class="actions">'+(e.answered?'<button class="btn" id="enext">Nächste Fehlerfrage</button>':'')+'<button class="btn secondary" id="eback">Modulübersicht</button></div></section>';if(!e.answered){var bs=document.querySelectorAll("[data-ea]");for(i=0;i<bs.length;i++)bs[i].onclick=function(){e.selected=Number(this.getAttribute("data-ea"));e.answered=true;if(e.choices[e.selected]===q.correct)removeError(e.mid,q.uid);else addError(e.mid,q.uid);renderError()}}else document.getElementById("enext").onclick=nextError;document.getElementById("eback").onclick=function(){renderModule(e.mid)}}
function bindNav(){var bs=document.querySelectorAll("[data-nav]");for(var i=0;i<bs.length;i++)bs[i].onclick=function(){var v=this.getAttribute("data-nav");if(v==="home")renderHome();else renderModule(v)}}
try{bindNav();renderHome()}catch(err){app.innerHTML='<section class="panel"><h2>Technischer Fehler</h2><div class="notice">'+esc(err&&err.message?err.message:String(err))+'</div></section>'}
})();
</script>
</body>
</html>
